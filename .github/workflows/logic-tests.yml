name: KAlarm · Testes e TypeScript
on:
  pull_request:
  push:
    branches: [main]
jobs:
  logic-and-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar motor de doses
        run: node --experimental-strip-types --test proofs/scheduling/tests/*.test.ts
      - name: Testar alarmes
        run: node --experimental-strip-types --test proofs/reminders/tests/*.test.ts
      - name: Testar SQLite
        run: python -m unittest discover -s proofs/sqlite/tests -v
      - name: Verificar SoftCare
        run: node mobile/scripts/verify-softcare-icons.cjs
  expo-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile
      - name: Validar arquivo de entrada e resolução do Router
        run: pnpm run check:entry
      - name: Checar Expo
        run: pnpm exec expo install --check
      - name: TypeScript
        run: pnpm run check
      - name: Compilar bundle JavaScript Android (Metro)
        run: pnpm exec expo export --platform android --output-dir .expo-ci-bundle
