name: KAlarm · Testes e TypeScript
on:
  pull_request:
  push:
    branches: [main]
jobs:
  logic-and-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar motor de doses
        run: node --experimental-strip-types --test proofs/scheduling/tests/*.test.ts
      - name: Testar alarmes
        run: node --experimental-strip-types --test proofs/reminders/tests/*.test.ts
      - name: Testar SQLite
        run: python -m unittest discover -s proofs/sqlite/tests -v
      - name: Verificar SoftCare
        run: node scripts/verify-softcare-icons.cjs
      - name: Verificar estrutura única na raiz
        run: node --test scripts/project-layout.test.cjs
  expo-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile
      - name: Validar arquivo de entrada e resolução do Router
        run: pnpm run check:entry
      - name: Testar isolamento do Expo Go
        run: pnpm run test:go-mode
      - name: Validar layout da raiz
        run: pnpm run test:layout
      - name: Checar Expo
        run: pnpm exec expo install --check
      - name: TypeScript
        run: pnpm run check
      - name: Compilar bundle JavaScript Android (Metro / Development Build)
        run: pnpm exec expo export --platform android --output-dir .expo-ci-bundle
      - name: Compilar bundle Android com notificações isoladas (Expo Go)
        env:
          KALARM_EXPO_GO_SAFE: "1"
          EXPO_PUBLIC_KALARM_GO_SAFE: "1"
          EXPO_PUBLIC_KALARM_SMOKE: "0"
        run: pnpm exec expo export --platform android --output-dir .expo-ci-go-bundle
      - name: Compilar diagnóstico mínimo do Expo Go
        env:
          KALARM_EXPO_GO_SAFE: "1"
          EXPO_PUBLIC_KALARM_GO_SAFE: "1"
          EXPO_PUBLIC_KALARM_SMOKE: "1"
        run: pnpm exec expo export --platform android --output-dir .expo-ci-smoke-bundle
